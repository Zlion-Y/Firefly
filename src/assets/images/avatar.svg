<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="1" stop-color="#f0eaff"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26222b"/>
      <stop offset="1" stop-color="#16131a"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332d3b"/>
      <stop offset="1" stop-color="#211c28"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <path d="M 512 96 C 730 88 900 240 906 470 C 912 700 740 880 512 884 C 284 888 118 710 116 480 C 114 250 294 104 512 96 Z"
        fill="#ffffff" opacity="0.55"/>

  <!-- 漂浮的抽象小元素 -->
  <g opacity="0.85">
    <path d="M 168 292 L 182 328 L 218 342 L 182 356 L 168 392 L 154 356 L 118 342 L 154 328 Z" fill="#c9a6ff"/>
    <path d="M 856 208 L 868 236 L 896 248 L 868 260 L 856 288 L 844 260 L 816 248 L 844 236 Z" fill="#ffb1c8"/>
    <circle cx="880" cy="640" r="16" fill="none" stroke="#c9a6ff" stroke-width="8"/>
    <path d="M 150 660 L 196 660 M 173 637 L 173 683" stroke="#ffb1c8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="248" cy="160" r="10" fill="#c9a6ff" opacity="0.7"/>
    <circle cx="790" cy="110" r="8" fill="#ffb1c8" opacity="0.7"/>
  </g>

  <!-- 耳朵 -->
  <circle cx="266" cy="530" r="42" fill="#f8cbb4"/>
  <circle cx="758" cy="530" r="42" fill="#f8cbb4"/>

  <!-- 脖子 -->
  <rect x="446" y="660" width="132" height="190" rx="20" fill="#f8cbb4"/>

  <!-- 脸 -->
  <ellipse cx="512" cy="490" rx="252" ry="246" fill="#ffdccb"/>

  <!-- 头发：炸毛 + 碎刘海 -->
  <path d="M 272 460
           C 254 342 300 232 396 202
           L 372 130 L 448 190
           L 512 198
           L 566 128 L 612 208
           L 700 152 L 706 236
           L 792 268 L 736 330
           C 764 372 760 424 752 462
           L 702 430 L 676 486 L 630 440
           L 584 494 L 542 444
           L 492 498 L 452 448
           L 402 496 L 366 444
           L 322 486 L 298 430
           Z"
        fill="url(#hairGrad)"/>
  <!-- 头发紫色高光 -->
  <path d="M 356 276 Q 408 234 468 226" stroke="#b78bff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 596 240 Q 648 250 686 286" stroke="#b78bff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- 圆框眼镜 -->
  <g>
    <line x1="288" y1="502" x2="262" y2="514" stroke="#2b2630" stroke-width="16" stroke-linecap="round"/>
    <line x1="736" y1="502" x2="762" y2="514" stroke="#2b2630" stroke-width="16" stroke-linecap="round"/>
    <circle cx="398" cy="508" r="104" fill="#ffffff" opacity="0.30"/>
    <circle cx="626" cy="508" r="104" fill="#ffffff" opacity="0.30"/>
    <circle cx="398" cy="508" r="104" fill="none" stroke="#2b2630" stroke-width="16"/>
    <circle cx="626" cy="508" r="104" fill="none" stroke="#2b2630" stroke-width="16"/>
    <path d="M 500 492 Q 512 482 524 492" stroke="#2b2630" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- 镜片高光 -->
    <path d="M 344 452 L 404 428" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <path d="M 572 452 L 632 428" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 眼睛 -->
  <circle cx="400" cy="514" r="27" fill="#241f26"/>
  <circle cx="390" cy="504" r="9" fill="#ffffff"/>
  <circle cx="624" cy="514" r="27" fill="#241f26"/>
  <circle cx="614" cy="504" r="9" fill="#ffffff"/>

  <!-- 腮红 -->
  <ellipse cx="322" cy="622" rx="50" ry="26" fill="#ffb3a8" opacity="0.6"/>
  <ellipse cx="702" cy="622" rx="50" ry="26" fill="#ffb3a8" opacity="0.6"/>

  <!-- 开口笑 -->
  <path d="M 434 626 Q 512 646 590 626 Q 584 716 512 724 Q 440 716 434 626 Z" fill="#5b2a33"/>
  <path d="M 452 634 Q 512 650 572 634 L 568 660 Q 512 674 456 660 Z" fill="#ffffff"/>
  <ellipse cx="512" cy="702" rx="44" ry="18" fill="#f2888d"/>

  <!-- 卫衣 -->
  <path d="M 96 1024 C 116 836 268 762 512 762 C 756 762 908 836 928 1024 Z" fill="url(#hoodieGrad)"/>
  <ellipse cx="512" cy="826" rx="108" ry="44" fill="#1c1723"/>
  <!-- 抽绳 -->
  <line x1="462" y1="888" x2="456" y2="964" stroke="#c9a6ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="562" y1="888" x2="568" y2="964" stroke="#c9a6ff" stroke-width="10" stroke-linecap="round"/>
  <!-- 卫衣上的紫色小星星 -->
  <path d="M 296 918 L 306 942 L 330 952 L 306 962 L 296 986 L 286 962 L 262 952 L 286 942 Z" fill="#c9a6ff" opacity="0.9"/>
  <path d="M 724 946 L 732 966 L 752 974 L 732 982 L 724 1002 L 716 982 L 696 974 L 716 966 Z" fill="#c9a6ff" opacity="0.75"/>
</svg>
